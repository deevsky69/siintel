name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    name: API — lint, typecheck, test, migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: predpol
          POSTGRES_PASSWORD: predpol
          POSTGRES_DB: prediksi_presisi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predpol -d prediksi_presisi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://predpol:predpol@localhost:5432/prediksi_presisi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --frozen
      - run: uv run ruff check . ../../database/migrations
      - run: uv run ruff format --check . ../../database/migrations
      - run: uv run mypy

      # Migration harus reproducible dari database kosong (CLAUDE.md §20).
      - name: Migrate from empty database
        run: uv run alembic upgrade head
      - name: Migration is reversible
        run: uv run alembic downgrade base && uv run alembic upgrade head

      # Sebagian besar test berjalan di atas data nyata, bukan fixture buatan — itu
      # yang membuatnya membuktikan sesuatu (CLAUDE.md §20). Tanpa langkah ini seluruh
      # test API gagal di database kosong. Langkah ini juga menguji `seeding all` itu
      # sendiri, yang dipakai runbook deployment untuk mengisi database produksi.
      - name: Seed data contoh
        run: uv run python -m prediksi_presisi_api.seeding all
        env:
          JWT_SECRET: ci-hanya-untuk-pengujian-minimal-tiga-puluh-dua-bytes

      # Menjalankan unit test dan integration test terhadap PostGIS sungguhan.
      - run: uv run pytest
        env:
          JWT_SECRET: ci-hanya-untuk-pengujian-minimal-tiga-puluh-dua-bytes
