[project]
name = "prediksi-presisi-api"
version = "0.1.0"
description = "PREDIKSI PRESISI — backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediksi_presisi_api"]

# ---------------------------------------------------------------------------
# Ruff — lint DAN format dalam satu alat (menggantikan black + isort + flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "S",        # bandit — keamanan dasar (CLAUDE.md §28)
  "ANN",      # anotasi tipe
  "RUF",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert diperbolehkan di test

# ---------------------------------------------------------------------------
# mypy — typecheck (padanan `tsc --noEmit` di sisi web)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
