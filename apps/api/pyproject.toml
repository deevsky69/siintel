[project]
name = "prediksi-presisi-api"
version = "0.1.0"
description = "PREDIKSI PRESISI — backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  # Melucuti EXIF dari foto yang dikirim warga. Foto ponsel hampir selalu membawa
  # koordinat GPS di dalamnya, dan pelapor yang tidak mengetik namanya tetap dikenali
  # dari sana bila metadatanya ikut tersimpan.
  "pillow>=11.0",
  # Menerima unggahan multipart pada kanal laporan masyarakat.
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "httpx>=0.28",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediksi_presisi_api"]

# ---------------------------------------------------------------------------
# Ruff — lint DAN format dalam satu alat (menggantikan black + isort + flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "S",        # bandit — keamanan dasar (CLAUDE.md §28)
  "ANN",      # anotasi tipe
  "RUF",
]
ignore = [
  "ANN401",
  # Dokumentasi ditulis dalam Bahasa Indonesia dan memakai tanda baca tipografis
  # (en dash, dsb.) di docstring/komentar. RUF001 (kode/string) tetap aktif.
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# `Depends()`/`Query()` pada default argumen adalah idiom resmi FastAPI, bukan bug.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Cookie",
  "prediksi_presisi_api.api.deps.require_permission",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert diperbolehkan di test

# ---------------------------------------------------------------------------
# mypy — typecheck (padanan `tsc --noEmit` di sisi web)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
