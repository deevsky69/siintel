# Alembic — sistem migration PREDIKSI PRESISI (TASK 010)
#
# Script migration disimpan di database/migrations sesuai docs/07-project-structure.md.
# URL database TIDAK ditulis di sini; dibaca dari environment lewat env.py (CLAUDE.md §28).
#
# Jalankan dari apps/api:
#   uv run alembic upgrade head
#   uv run alembic revision -m "deskripsi"

[alembic]
script_location = ../../database/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
