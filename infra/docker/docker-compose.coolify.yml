# ---------------------------------------------------------------------------
# JALUR A — PINTU MASUK LEWAT COOLIFY (Traefik) YANG SUDAH TERPASANG DI SERVER INI.
#
# INI JALUR YANG DIPAKAI UNTUK DEMO. Dipakai bersama berkas dasar:
#
#   docker compose --env-file .env.production \
#     -f infra/docker/docker-compose.prod.yml \
#     -f infra/docker/docker-compose.coolify.yml up -d
#
# ---------------------------------------------------------------------------
# FAKTA SERVER YANG MENDASARI BERKAS INI (diperiksa langsung, bukan dugaan):
#
#   docker network ls
#     -> nama network milik proxy: `coolify` (bridge, attachable)
#
# CATATAN PORT PUBLIK SERVER INI (1 September 2026):
#   Router meneruskan 111.68.123.134:8997 → 80 dan :8998 → 443. Port 80 dan 443
#   sendiri TIDAK diteruskan, sehingga Let's Encrypt tidak dapat memverifikasi
#   domain (HTTP-01 selalu menghubungi port 80, TLS-ALPN-01 selalu port 443).
#   Selama itu belum berubah, sertifikat sah tidak akan terbit. Lihat docs/10 §3.
#
#   docker inspect coolify-proxy
#     -> image      : traefik:v3.6
#     -> port host  : 80, 443, 8080, 443/udp  (SUDAH DIPAKAI — jangan diikat lagi)
#     -> entrypoint : `http` (:80) dan `https` (:443, dengan HTTP/3)
#     -> provider   : --providers.docker=true --providers.docker.exposedbydefault=false
#                     artinya container HARUS memasang label `traefik.enable=true`
#                     agar dikenali; tanpa label, container tidak dirutekan.
#     -> sertifikat : --certificatesresolvers.letsencrypt.acme.httpchallenge=true
#                     artinya nama resolver yang benar adalah `letsencrypt`,
#                     dan tantangan ACME berjalan lewat entrypoint `http`.
#
# Karena itu: TIDAK ADA konfigurasi certbot/acme milik kita sendiri. Menerbitkan
# sertifikat untuk domain yang sama dari dua tempat akan saling menggagalkan.
# Penerbitan dan pembaruan sertifikat sepenuhnya milik Traefik-nya Coolify.
# ---------------------------------------------------------------------------

services:
  web:
    networks:
      # `internal` tetap diperlukan untuk menjangkau `api`.
      - internal
      # `coolify` adalah tempat Traefik dapat melihat dan menjangkau container ini.
      - coolify
    labels:
      traefik.enable: "true"
      # Traefik harus tahu lewat network mana container ini dihubungi, karena
      # container berada di dua network sekaligus.
      traefik.docker.network: coolify

      # ---- HTTP (:80) — hanya untuk mengalihkan ke HTTPS dan melayani tantangan ACME
      traefik.http.routers.predpol-web-http.entrypoints: http
      traefik.http.routers.predpol-web-http.rule: Host(`${DOMAIN:?DOMAIN belum diisi di .env.production}`)
      traefik.http.routers.predpol-web-http.middlewares: predpol-https-redirect
      traefik.http.middlewares.predpol-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.predpol-https-redirect.redirectscheme.permanent: "true"
      # Port publik HTTPS. Wajib disebut bila router meneruskan port tidak lazim
      # (di server ini 8997 → 80 dan 8998 → 443): tanpa ini pengalihan menunjuk
      # port 443 yang tidak diteruskan, dan situs tampak mati padahal hidup.
      # Kosongkan `PUBLIC_HTTPS_PORT` bila kelak 443 diteruskan apa adanya.
      traefik.http.middlewares.predpol-https-redirect.redirectscheme.port: "${PUBLIC_HTTPS_PORT:-443}"

      # ---- HTTPS (:443) — rute sebenarnya
      traefik.http.routers.predpol-web.entrypoints: https
      traefik.http.routers.predpol-web.rule: Host(`${DOMAIN}`)
      traefik.http.routers.predpol-web.tls: "true"
      # Penerbitan sertifikat SENGAJA tidak dipasang di sini — lihat
      # `docker-compose.letsencrypt.yml`. Meminta sertifikat selagi port 80/443
      # belum diteruskan bukan sekadar sia-sia: setiap percobaan gagal terhitung
      # pada batas Let's Encrypt (5 kegagalan per host per jam), sehingga justru
      # menunda sertifikat asli ketika portnya nanti dibuka.
      # Tanpa resolver, Traefik menyajikan sertifikat bawaannya sendiri.
      traefik.http.routers.predpol-web.service: predpol-web
      traefik.http.routers.predpol-web.middlewares: predpol-security-headers
      traefik.http.services.predpol-web.loadbalancer.server.port: "3000"

      # ---- Header keamanan.
      #
      # HSTS SENGAJA TIDAK DIPASANG SELAMA SERTIFIKATNYA SWATANDATANGAN.
      #
      #   HSTS memerintahkan peramban: "selama setahun, selalu pakai HTTPS untuk domain ini,
      #   dan JANGAN PERNAH izinkan pengguna melewati peringatan sertifikat." Perintah kedua
      #   itu benar ketika sertifikatnya tepercaya, dan berbahaya ketika tidak.
      #
      #   Pada 7 September 2026 kombinasi itu benar-benar mematikan situs: sertifikat diganti
      #   (TRAEFIK DEFAULT CERT -> CA milik satuan), pengecualian yang sudah disetujui
      #   pengguna menjadi batal, dan HSTS melarangnya menyetujui yang baru. Peramban menolak
      #   membuka halaman tanpa menyediakan jalan keluar apa pun, dan dari sisi pengguna itu
      #   tidak dapat dibedakan dari server yang mati.
      #
      #   `stsSeconds: 0` bukan sekadar "tidak memasang": ia MEMERINTAHKAN peramban melupakan
      #   kebijakan yang sudah tersimpan. Tanpa itu, peramban yang terlanjur menyimpannya
      #   tetap terkunci sampai setahun.
      #
      #   PASANG KEMBALI `31536000` begitu sertifikat Let's Encrypt terbit — di sanalah HSTS
      #   memang seharusnya berada.
      traefik.http.middlewares.predpol-security-headers.headers.stsSeconds: "0"
      traefik.http.middlewares.predpol-security-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.predpol-security-headers.headers.frameDeny: "true"
      traefik.http.middlewares.predpol-security-headers.headers.referrerPolicy: "no-referrer"
      traefik.http.middlewares.predpol-security-headers.headers.permissionsPolicy: "geolocation=(), microphone=(), camera=()"
      traefik.http.middlewares.predpol-security-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy: "same-origin"

  # `api` dibuka ke publik sejak 6 September 2026, saat aplikasi Android dibangun.
  #
  # MENGAPA AWALAN PATH, BUKAN SUBDOMAIN
  #
  #   Rancangan semula memakai `api.<domain>`, dan itu memang lebih rapi. Tetapi
  #   subdomain menuntut satu A record baru di panel DomaiNesia — panel yang sedang
  #   terbukti tidak dapat diandalkan: record `_acme-challenge` gagal tersimpan empat
  #   kali berturut-turut tanpa pesan galat apa pun (`docs/10` §3.2).
  #
  #   Awalan path tidak menuntut DNS sama sekali. `/api/v1/*` juga bebas dari bentrokan:
  #   rute BFF milik aplikasi web hanya `/api/auth/login` dan `/api/auth/logout`, tanpa
  #   `/v1`. Prioritas dinaikkan supaya rute ini menang atas rute web yang mencocokkan
  #   seluruh Host.
  #
  # APA YANG SEKARANG TERBUKA, DAN APA YANG TIDAK
  #
  #   Yang terbuka adalah permukaan yang memang dirancang untuk itu: kanal publik
  #   (berbatas laju, tanpa identitas) dan penukaran kredensial dengan token. Seluruh
  #   endpoint lain tetap menuntut token dan tetap memeriksa kewenangan serta cakupan
  #   wilayah di query — tidak ada yang berubah di sana.
  #
  #   Yang TIDAK terbuka: basis data, dan `/openapi.json` yang memang dimatikan di
  #   produksi.
  api:
    networks:
      - internal
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.predpol-api.entrypoints: https
      traefik.http.routers.predpol-api.rule: Host(`${DOMAIN}`) && PathPrefix(`/api/v1`)
      # Lebih tinggi daripada rute web, yang mencocokkan Host saja. Tanpa ini, Traefik
      # memilih menurut panjang aturan dan hasilnya bergantung pada kebetulan.
      traefik.http.routers.predpol-api.priority: "100"
      traefik.http.routers.predpol-api.tls: "true"
      traefik.http.routers.predpol-api.service: predpol-api
      traefik.http.routers.predpol-api.middlewares: predpol-security-headers
      traefik.http.services.predpol-api.loadbalancer.server.port: "8000"

networks:
  # Network ini SUDAH ADA dan dimiliki Coolify. `external: true` berarti compose
  # hanya menyambung ke sana — tidak membuat, tidak mengubah, dan tidak menghapusnya.
  coolify:
    external: true
    name: coolify
