# THRESHOLD KELAS RISIKO & PERINGATAN DINI — PREDIKSI PRESISI
#
# Status: versi `dummy-v1` = FINAL — DITETAPKAN pemilik proyek 9 September 2026 (U-01).
#         versi `proposed-2026-09-01` = PROPOSED, belum dipakai menghitung apa pun.
#         blok `leadership_display` = PROPOSED, menunggu keputusan terpisah (U-22).
#
# ASAL ANGKANYA, DAN ARTI PENETAPANNYA
#
#   Nilai di bawah mula-mula tidak dipilih siapa pun: ia secara de facto sudah tertanam di
#   dataset dummy, dan temuan audit U-01 hanya membuatnya terlihat. Menuliskannya sebagai
#   konfigurasi membuatnya dapat ditinjau; penetapan 9 September 2026 membuatnya dapat
#   dipertanggungjawabkan — ambang ini kini berlaku karena diputus, bukan karena kebetulan
#   ada di data.
#
#   Yang ditetapkan adalah AMBANGNYA, bukan klaim bahwa memilih 70 sebagai batas terbit
#   peringatan menghasilkan keseimbangan terbaik antara peringatan yang terlewat dan
#   peringatan yang tidak berujung gangguan. Pertanyaan itu hanya dapat dijawab evaluasi,
#   dan jawabannya dapat menuntut versi ambang baru kelak.
#
#   Tidak ada satu angka pun yang berubah saat penetapan ini, sehingga seluruh peringatan
#   yang sudah terbit tetap sah: ia terbit di bawah ambang yang persis sama dengan yang
#   kini ditetapkan.
#
# Threshold TIDAK dipasang sebagai CHECK constraint (docs/06 §3) dan TIDAK di-hardcode
# di kode mana pun (CLAUDE.md §12). Setiap peringatan menyimpan `threshold_version`.

# MENGAPA BERVERSI
#
#   Setiap baris `early_warnings` menyimpan `threshold_version`. Ambang sebuah versi yang
#   masih dirujuk baris mana pun TIDAK BOLEH diubah: menurunkannya akan membuat peringatan
#   lama tampak seolah terbit di bawah aturan yang tidak pernah berlaku saat itu, dan
#   alasan terbitnya tidak lagi dapat ditelusuri.
#
#   Cara yang benar untuk mengubah ambang adalah menambah versi baru.

# Versi yang dipakai seed dan mesin penilaian saat ini.
active_version: dummy-v1

versions:
  # ===========================================================================
  # dummy-v1 — DITETAPKAN 9 September 2026. BERLAKU untuk seluruh baris
  # `early_warnings` yang sudah ada.
  #
  # JANGAN diubah. Larangannya menguat setelah ditetapkan: menurunkan ambang di sini
  # tidak hanya membuat peringatan lama tampak terbit di bawah aturan yang tidak
  # pernah berlaku, tetapi juga mengubah ketentuan yang sudah diputus pemilik proyek.
  # ===========================================================================
  dummy-v1:
    status: FINAL
    ditetapkan: 2026-09-09
    risk_classes:
      - { class: LOW, min: 0, max: 44 }
      - { class: MODERATE, min: 45, max: 69 }
      - { class: HIGH, min: 70, max: 84 }
      - { class: CRITICAL, min: 85, max: 100 }
    early_warning:
      # Satu ambang untuk seluruh jenis ancaman.
      default:
        minimum_score: 70
        severities:
          - { severity: WATCH, min: 60, max: 69 }
          - { severity: WARNING, min: 70, max: 84 }
          - { severity: CRITICAL, min: 85, max: 100 }

  # ===========================================================================
  # proposed-2026-09-01 — ambang terpisah untuk gangguan terencana.
  #
  # Keputusan pemilik proyek, 1 September 2026: peringatan bagi Kelompok B
  # (unjuk rasa, keramaian, tawuran) terbit pada skor >= 60, bukan 70.
  #
  # Alasannya bukan bahwa gangguan terencana lebih berbahaya, melainkan bahwa ia
  # punya WAKTU PERSIAPAN. Peringatan curanmor yang terbit sejam sebelum kejadian
  # masih berguna untuk mengarahkan patroli; peringatan unjuk rasa yang terbit
  # sejam sebelum massa berkumpul sudah terlambat untuk menyiapkan pengamanan.
  # Ambang yang lebih rendah membeli waktu itu.
  #
  # Ongkosnya dinyatakan terbuka: lebih banyak peringatan yang tidak berujung
  # gangguan. Untuk Kelompok B hal itu BUKAN kegagalan prediksi — lihat docs/16 §4.
  #
  # Belum dipakai menghitung apa pun. Menyalakannya berarti mengubah
  # `active_version` DAN membangkitkan ulang peringatannya.
  # ===========================================================================
  proposed-2026-09-01:
    status: PROPOSED
    risk_classes:
      # Kelas risiko TIDAK berubah — yang berubah hanya ambang penerbitan peringatan.
      - { class: LOW, min: 0, max: 44 }
      - { class: MODERATE, min: 45, max: 69 }
      - { class: HIGH, min: 70, max: 84 }
      - { class: CRITICAL, min: 85, max: 100 }
    early_warning:
      default:
        minimum_score: 70
        severities:
          - { severity: WATCH, min: 60, max: 69 }
          - { severity: WARNING, min: 70, max: 84 }
          - { severity: CRITICAL, min: 85, max: 100 }
      # Ambang per profil penilaian pada config/risk/risk-weights.yaml.
      # Nama profilnya harus sama persis; dijaga `test_threshold_profiles_match_weights`.
      profiles:
        planned:
          minimum_score: 60
          # Severity ikut digeser satu tingkat: skor 60–69 yang pada Kelompok A hanya
          # berstatus WATCH, di sini sudah menuntut tindakan penyiapan.
          severities:
            - { severity: WATCH, min: 50, max: 59 }
            - { severity: WARNING, min: 60, max: 84 }
            - { severity: CRITICAL, min: 85, max: 100 }

# Catatan: pada dataset dummy, level LOW dan WATCH tidak pernah muncul karena peringatan
# hanya dibuat pada skor >= 70. Ini terlihat jelas hanya setelah ambangnya ditulis di sini.

# =============================================================================
# TAMPILAN LAYAR PIMPINAN — DEMO / PROPOSED, REQUIRES USER APPROVAL
# =============================================================================
#
# Blok ini TIDAK ikut menghitung skor apa pun. Ia hanya menentukan bagaimana angka yang
# sudah dihitung diberi NAMA di layar Pimpinan. Karena itu ia berada di tingkat atas berkas
# dan tidak berversi: tidak ada baris tersimpan yang merujuknya, sehingga mengubahnya tidak
# membuat catatan lama tampak terbit di bawah aturan yang tidak pernah berlaku.
#
# Ia tetap berada di berkas ini, bukan di kode, karena keduanya adalah ambang — dan ambang
# hanya boleh hidup di satu tempat (CLAUDE.md §12).
leadership_display:
  status: PROPOSED

  # ---------------------------------------------------------------------------
  # STATUS WILAYAH — Aman / Waspada / Siaga
  #
  # Permintaan pemilik proyek, 2 September 2026. Sistem sudah memiliki EMPAT kelas risiko;
  # nama status yang diminta hanya TIGA, jadi dua kelas harus digabung dan penggabungan itu
  # mengubah makna. Yang dipilih di sini:
  #
  #   HIGH + CRITICAL -> SIAGA
  #
  # bukan LOW + MODERATE -> AMAN, karena kesalahan kedua arah tidak sepadan. Menggabungkan
  # dari atas hanya membuat wilayah CRITICAL diperlakukan setara HIGH — keduanya sama-sama
  # menuntut tindakan. Menggabungkan dari bawah akan menyebut wilayah MODERATE sebagai
  # "Aman", dan kata itu menghentikan orang bertanya lebih jauh.
  #
  # BELUM DISETUJUI. Layar menyatakan pemetaan ini terbuka beserta statusnya.
  # ---------------------------------------------------------------------------
  area_status:
    - { status: AMAN, label: Aman, risk_classes: [LOW] }
    - { status: WASPADA, label: Waspada, risk_classes: [MODERATE] }
    - { status: SIAGA, label: Siaga, risk_classes: [HIGH, CRITICAL] }

  # ---------------------------------------------------------------------------
  # PERINGKAT VOLUME LAPORAN — daftar "Top 10 area rawan"
  #
  # Daftar itu diurutkan menurut JUMLAH LAPORAN per wilayah, dan jumlah laporan TIDAK punya
  # kelas risiko: ia tidak ditimbang dan tidak dinormalkan terhadap luas maupun penduduk.
  #
  # Tingkat di bawah karena itu bukan kelas risiko melainkan peringkat volume, dan ambangnya
  # RELATIF terhadap wilayah dengan laporan terbanyak pada jendela yang sedang tampil —
  # bukan terhadap angka mutlak. Wilayah dengan 70% laporan sebanyak wilayah teratas
  # berperingkat KRITIS pada jendela itu; pada jendela lain, jumlah yang sama bisa
  # berperingkat lain. Layar menyatakan hal ini.
  # ---------------------------------------------------------------------------
  report_volume:
    - { level: KRITIS, label: Kritis, min_share_of_peak: 0.70 }
    - { level: SEDANG, label: Sedang, min_share_of_peak: 0.40 }
    - { level: RENDAH, label: Rendah, min_share_of_peak: 0.0 }
