# Peringkat bulanan 65 kelurahan — Modul 2–3 "Mekanisme dan Fungsi SIGAP".
#
# 17 November 2026 — disesuaikan ke naskah Taskap Bab IV (keputusan pemilik proyek):
#   - metode utama adalah MODEL, gradient boosting per kelurahan untuk kelompok berobjek
#     kendaraan bermotor (services/monthly_model.py);
#   - peta historis tetap dihitung sebagai PEMBANDING: 3 bulan, 12 bulan, bulan sebelumnya,
#     dan peta tahunan tetap;
#   - naskah: "model hanya dipakai bila lebih tepat daripada peta titik rawan". Aturan itu
#     dijalankan oleh `guard` di bawah, bukan oleh ingatan orang: bila pada bulan-bulan uji
#     terakhir model tidak mengungguli pembanding terbaik, usulan kembali memakai peta.
# Menggantikan keputusan 2A (6 November 2026): "peta 3 bulan dulu, model menyusul".
#
# IKW (Indeks Kerawanan Wilayah) — rancangan: frekuensi 12 bulan, tren, konsistensi.
# Bobot dan ambang kategori di bawah ini BELUM diuji: status PROPOSED (dokumen: "diuji
# sebelum dipakai"). IKW ditampilkan di samping peringkat, tidak menentukan urutan.
version: peringkat-2026-11-17
status: PROPOSED

default_method: MODEL
methods:
  MODEL:
    label: Model AI (gradient boosting)
    kind: model
    basis_months: 12
  HISTORY_3M:
    label: Peta 3 bulan terakhir
    kind: history
    basis_months: 3
  HISTORY_12M:
    label: Peta 12 bulan terakhir
    kind: history
    basis_months: 12
  HISTORY_1M:
    label: Bulan sebelumnya
    kind: history
    basis_months: 1
  ANNUAL:
    # Peta "lama" yang tidak diperbarui: seluruh kejadian satu tahun kalender, sebagaimana
    # diketahui pada akhir tahun itu. Tahunnya = tahun terakhir masa latih model.
    label: Peta tahunan tetap
    kind: annual
    basis_months: 12

# Model gradient boosting. DIBEKUKAN: parameter dan masa latih tidak diubah tanpa pengujian
# tersendiri (naskah Modul 3). Sejak 19 November 2026 seluruh pengaturan mengikuti "Protokol
# Replikasi Prediksi" naskah Taskap final, Lampiran 8 E — bukan lagi pilihan penyusun teknis
# (catatan 185). scikit-learn dikunci pada versi naskah (1.8.0) di apps/api/pyproject.toml.
model:
  version: "2026-11-19"
  data_from: "2023-01-01"     # awal data Pusiknas yang utuh
  train_until: "2024-12-31"   # kejadian yang dilaporkan sesudahnya tidak pernah dilihat model
  min_history_months: 6       # riwayat minimal enam bulan → bulan sasaran latih sejak Juli 2023
  max_horizon: 12             # horizon 1–12 bulan; bobot baris = 1 / jumlah horizon tersedia
  min_training_rows: 300
  max_iter: 100
  max_leaf_nodes: 7
  min_samples_leaf: 40
  learning_rate: 0.05
  l2_regularization: 2
  random_state: 42

# Penjaga pemakaian model. Dinilai pada `months` bulan terakhir sebelum bulan sasaran yang
# berada DI LUAR masa latih, pada `evaluation.default_top_n` kelurahan, dengan batas data
# yang sama untuk semua metode. Model dipakai hanya bila cakupannya LEBIH TINGGI daripada
# pembanding terbaik; bila bulan ujinya kurang dari `min_months`, atau model belum dapat
# dilatih, usulan memakai `fallback`.
guard:
  months: 12
  min_months: 3
  fallback: HISTORY_3M

# Cakupan kejadian yang dihitung: seluruh 3C, atau hanya berobjek kendaraan bermotor.
# Naskah menguji model pada kelompok berobjek kendaraan dan tidak menggeneralisasinya ke
# seluruh 3C, jadi kelompok itulah yang menjadi dasar peringkat. ALL_3C tetap tersedia;
# penjaga di atas berlaku per cakupan.
scopes: [ALL_3C, VEHICLE]
default_scope: VEHICLE

ikw:
  weights:
    frequency: 0.50    # jumlah 12 bulan, dinormalkan ke kelurahan tertinggi
    trend: 0.25        # rata-rata 3 bulan terakhir dibanding 9 bulan sebelumnya
    consistency: 0.25  # bagian bulan (dari 12) yang mencatat >= 1 kejadian
  categories:          # 0–100, PROPOSED
    RENDAH: [0, 34]
    SEDANG: [35, 64]
    TINGGI: [65, 100]

# Produk bulanan (Modul 4): berapa kelurahan teratas yang dibuatkan draf usulan oleh sistem.
# Pimpinan tetap bebas memilih jumlah dan kelurahan mana pun yang tidak ditolak analis.
product:
  draft_top_n: 10

# Evaluasi bulanan (Modul 5): jumlah kelurahan teratas yang dinilai cakupannya bila Pimpinan
# belum menetapkan jumlah — mengikuti Uji Prediksi 2025 (enam kelurahan per metode).
evaluation:
  default_top_n: 6
