# Rekaman pilihan kelurahan pada uji prediksi naskah Taskap revisi 7, Lampiran J bagian H, I,
# dan J — DISALIN DARI NASKAH, nama demi nama, dalam URUTAN PERINGKAT yang tercetak di sana
# (22 November 2026, catatan 195; keputusan pemilik proyek).
#
# Yang direkam hanyalah KELURAHAN MANA yang dipilih tiap bulan. Jumlah kejadian tercakup,
# cakupan, porsi luas, dan PAI TIDAK ditulis di sini: aplikasi menghitungnya sendiri dari data
# kejadian. Uji historis memakai rekaman ini untuk baris model sehingga hasilnya sama dengan
# naskah; di luar bulan yang direkam, atau bila jumlah kelurahan yang diminta melebihi yang
# direkam (enam), model aplikasi yang dipakai.
