# PEMETAAN NILAI TAKSONOMI — PREDIKSI PRESISI
#
# Status: PROPOSED — REQUIRES USER APPROVAL (U-16 / keputusan B-3).
#
# Dataset dummy memakai istilah Bahasa Indonesia, sementara nilai yang DISIMPAN di database
# memakai UPPER_SNAKE berbahasa Inggris (docs/02 K-7). Berkas ini memetakan keduanya.
#
# Label untuk pengguna tetap Bahasa Indonesia dan diambil dari `labels` di bawah,
# sehingga tampilan tidak berubah meskipun nilai tersimpan berbahasa Inggris.
#
# Nomenklatur kedinasan (Polsek, Samapta, Curanmor, dst.) TIDAK diterjemahkan.
#
# Mengubah berkas ini tidak memerlukan migration: kolom taksonomi bertipe teks,
# justru karena daftar nilainya belum final.

version: proposed-2026-09-01

mappings:
