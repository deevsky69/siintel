      - crime:write
      - intelligence:read
      - patrol:read
      - patrol:write
      - police_unit:read
      - map:read
      - analytics:read
      - risk_score:read
      - prediction:read
      - warning:read
      - warning:acknowledge
      - public_alert:read
      - recommendation:read
      - commander_decision:read
      - operation:read
      - citizen_report:read
      - citizen_report:write
      - community_feedback:read
      - evaluation:read
      - audit:read

