# KATALOG PERMISSION & MATRIKS ROLE — PREDIKSI PRESISI
#
# Katalog `resource:action` = TECHNICAL DECISION (docs/03 §2).
# Pemberian permission per role = PROPOSED — menunggu jawaban P-1…P-7 (docs/03 §4).
#
# Berkas ini, bukan `data/sample/permissions.csv`, yang menjadi sumber seed RBAC.
# Dataset dummy lama hanya memuat 12 permission tanpa `scope`, sehingga tidak lagi
# mencerminkan model otorisasi yang dipakai (docs/03 §5).
#
# scope: ALL | OWN_JURISDICTION | OWN_FUNCTION

version: proposed-2026-09-01

permissions:
  dashboard: [read]
  location: [read, write]
  crime: [read, write, export]
  intelligence: [read, write]
  patrol: [read, write]
  police_unit: [read, write]
  map: [read]
  analytics: [read, export]
  risk_score: [read, run]
  prediction: [read, run, publish]
  warning: [read, acknowledge, resolve]
  public_alert: [read, publish]
  recommendation: [read, write]
  commander_decision: [read, approve]
  operation: [read, write]
  citizen_report: [read, write]
  community_feedback: [read]
  evaluation: [read, run]
  user: [read, manage]
  role: [read, manage]
  audit: [read]          # sengaja tanpa write/delete — audit bersifat append-only
  config: [read, manage]

roles:
  Pimpinan:
    ALL:
      - dashboard:read
      - location:read
      - crime:read
      - intelligence:read
      - patrol:read
      - police_unit:read
      - map:read
      - analytics:read
      - risk_score:read
      - prediction:read
      - warning:read
      - public_alert:read
      - recommendation:read
      - commander_decision:read
      - commander_decision:approve
      - operation:read
      - citizen_report:read
      - community_feedback:read
      - evaluation:read
      - audit:read
      - config:read

  Command Center:
    ALL:
      - dashboard:read
      - location:read
      - crime:read
      - intelligence:read
      - patrol:read
      - patrol:write
      - police_unit:read
      - map:read
      - analytics:read
      - risk_score:read
      - prediction:read
      - warning:read
      - warning:acknowledge
      - warning:resolve
      - public_alert:read
      - recommendation:read
      - recommendation:write
      - commander_decision:read
      - operation:read
      - operation:write
      - citizen_report:read
      - citizen_report:write
      - community_feedback:read
      - evaluation:read
      - audit:read
      - config:read

  Analyst:
    ALL:
      - dashboard:read
      - location:read
      - crime:read
      - crime:write
      - crime:export
      - intelligence:read
      - patrol:read
      - police_unit:read
      - map:read
      - analytics:read
      - analytics:export
      - risk_score:read
      - risk_score:run
      - prediction:read
      - prediction:run
      - prediction:publish
      - warning:read
      - public_alert:read
      - recommendation:read
      - recommendation:write
      - commander_decision:read
      - operation:read
      - citizen_report:read
      - community_feedback:read
      - evaluation:read
      - evaluation:run
      - audit:read
      - config:read

  # KOREKSI 1 September 2026 — cakupan disesuaikan dengan yang benar-benar dapat
  # ditegakkan. Sebelumnya `crime:read` dan sembilan permission lain dinyatakan
  # OWN_FUNCTION, padahal `crime_incidents` dan `intelligence_reports` tidak memiliki
  # kolom fungsi sama sekali: akun Fungsi tetap melihat seluruh 1200 kejadian.
  # Kewenangan yang dideklarasikan tetapi tidak dapat ditegakkan memberi rasa aman
  # yang keliru, dan itu lebih berbahaya daripada tidak dideklarasikan.
  #
  # Aturannya kini: OWN_FUNCTION hanya untuk data yang punya jalur ke sebuah fungsi.
  # Dijaga oleh `test_rbac_scope_is_enforceable`.
  Fungsi:
    ALL:
      - location:read
      - map:read
      - risk_score:read
      - prediction:read
      - warning:read
      - public_alert:read
      # Berikut ini TIDAK punya dimensi fungsi pada model datanya. Sebuah kejadian
      # curanmor bukan "milik" Reskrim, dan tren wilayah bukan milik satu fungsi.
      - dashboard:read
      - crime:read
      - crime:write
      - analytics:read
      - evaluation:read
    OWN_FUNCTION:
      # Seluruhnya punya jalur ke fungsi:
      #   recommendations.recommended_function
      #   commander_decisions -> recommendations.recommended_function
      #   operational_actions -> police_units.function
      #   patrol_activity     -> police_units.function
      #   police_units.function
      - recommendation:read
      - commander_decision:read
      - operation:read
      - patrol:read
      - patrol:write
      - police_unit:read

  # BELUM DIPUTUSKAN — dicabut sementara dari peran Fungsi.
  #
  #   intelligence:read, intelligence:write, citizen_report:read, audit:read
  #
  # `intelligence_reports`, `citizen_reports`, dan `audit_logs` tidak punya kolom
  # fungsi, sehingga OWN_FUNCTION mustahil ditegakkan. Menaikkannya menjadi ALL
  # berarti setiap petugas fungsi membaca seluruh laporan intelijen dan seluruh jejak
  # audit — termasuk keputusan Pimpinan. Itu pelebaran kewenangan, bukan koreksi
  # teknis, dan merupakan keputusan pemilik proyek (CLAUDE.md §2C).
  # Sampai diputuskan, permission ini tidak diberikan: menahan lebih aman daripada
  # melebarkan diam-diam.

  Polsek:
    ALL:
      - location:read
    OWN_JURISDICTION:
      - dashboard:read
      - crime:read
      - crime:write
      - intelligence:read
      - patrol:read
      - patrol:write
      - police_unit:read
      - map:read
      - analytics:read
      - risk_score:read
      - prediction:read
      - warning:read
      - warning:acknowledge
      - public_alert:read
      - recommendation:read
      - commander_decision:read
      - operation:read
      - citizen_report:read
      - citizen_report:write
      - community_feedback:read
      - evaluation:read
      - audit:read

  Administrator:
    ALL:
      - dashboard:read
      - location:read
      - location:write
      - crime:read
      - intelligence:read
      - patrol:read
      - police_unit:read
      - police_unit:write
      - map:read
      - analytics:read
      - risk_score:read
      - prediction:read
      - warning:read
      - public_alert:read
      - recommendation:read
      - commander_decision:read
      - operation:read
      - citizen_report:read
      - community_feedback:read
      - evaluation:read
      - user:read
      - user:manage
      - role:read
      - role:manage
      - audit:read
      - config:read
      - config:manage
