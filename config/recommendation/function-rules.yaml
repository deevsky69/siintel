# ATURAN FUNGSI REKOMENDASI — PREDIKSI PRESISI
#
# Status: PROPOSED — REQUIRES USER APPROVAL.
#
# Menjawab satu pertanyaan untuk setiap peringatan dini yang terbit: fungsi mana yang
# diusulkan bertindak (CLAUDE.md §14: Samapta, Binmas, Intelkam, Reskrim, Lantas).
# Sebelum 1 Oktober 2026 pertanyaan ini hanya dijawab oleh dataset sintetis; tidak ada
# kode runtime yang pernah menerbitkan rekomendasi. Berkas ini membuat aturannya terlihat,
# dapat diuji, dan dapat diganti tanpa menyentuh kode (CLAUDE.md §12).
#
# MENGAPA SAMAPTA UNTUK KETIGANYA
#
#   Ketiga jenis yang dinilai (Curanmor, Curat, Curas) adalah kejahatan jalanan dan
#   pencurian yang berulang menurut tempat dan jam. Tindakan PENCEGAHAN yang dapat
#   diarahkan oleh prediksi "sel X, jendela Y" adalah kehadiran petugas di sana pada jam
#   itu — patroli dan penjagaan, yaitu fungsi Samapta. Reskrim bekerja SETELAH kejadian,
#   Binmas bekerja pada jangka panjang. Menugaskan keduanya pada peringatan enam jam ke
#   depan tidak menjawab peringatannya.
#
#   Ini USULAN penyusun teknis, bukan ketentuan: siapa yang berwenang bertindak atas sebuah
#   peringatan adalah keputusan organisasi (CLAUDE.md §2 C). Mengubahnya di sini — misalnya
#   Curas ke Reskrim — langsung berlaku pada peringatan berikutnya, tidak pada yang sudah
#   terbit. Rekomendasi yang sudah terbit tidak ditimpa (U-07).
#
# PRIORITAS
#
#   Diturunkan dari severity peringatan, bukan ditentukan sendiri: dua angka untuk satu
#   hal yang sama akan saling bertentangan. Severity WATCH (60–69) tidak pernah terbit
#   sebagai peringatan pada ambang dummy-v1 (minimum 70), tetapi tetap dipetakan supaya
#   versi ambang berikutnya tidak menjumpai lubang.

status: PROPOSED
usulan: 2026-10-01

# Fungsi yang dipakai bila jenis ancaman tidak disebut pada `rules`.
default_function: SAMAPTA

rules:
  CURANMOR:
    function: SAMAPTA
    action: Tingkatkan patroli dan penjagaan
  CURAT:
    function: SAMAPTA
    action: Tingkatkan patroli dan penjagaan permukiman
  CURAS:
    function: SAMAPTA
    action: Tingkatkan patroli dan penjagaan

priority_by_severity:
  WATCH: MEDIUM
  WARNING: HIGH
  CRITICAL: URGENT

# ---------------------------------------------------------------------------------------
# REKOMENDASI MENURUT TEMPAT KEJADIAN — produk bulanan (naskah Taskap Tabel 13).
#
# Ditambahkan 18 November 2026 (penyesuaian ke naskah, butir 6 audit). Untuk tiap kelurahan
# usulan, sistem melihat JENIS TEMPAT yang paling banyak tercatat pada bulan-bulan dasar
# peringkat, lalu memakai alternatif rekomendasi dan fungsi pelaksana pada baris yang sesuai.
# Isi keempat baris mengikuti Tabel 13 naskah apa adanya. Bila tempat kejadian tidak tercatat
# atau tidak termasuk kelompok mana pun, dipakai `rules` per jenis ancaman di atas.
#
# `location_types` = nilai kategori tempat kejadian pada data (Pusiknas apa adanya).
# `function` = fungsi utama yang tercatat pada usulan; `executors` = pelaksana menurut naskah.
# Status tetap PROPOSED: ini alternatif untuk dinilai staf, Kasat, dan Pimpinan — bukan perintah.
# ---------------------------------------------------------------------------------------
place_rules:
  - id: rumah
    label: Rumah tinggal
    location_types: ["Perumahan / Pemukiman", Perkampungan]
    function: BINMAS
    executors: Bhabinkamtibmas
    action: Aktifkan siskamling dan imbauan kunci ganda melalui RT/RW
  - id: kos
    label: Kos, kontrakan, asrama
    location_types: [Kost, Kontrakan, Apartemen, Penginapan]
    function: BINMAS
    executors: Binmas, Polsek
    action: Koordinasikan pengamanan parkir penghuni dengan pengelola atau pemilik
  - id: jalan
    label: Jalan dan perparkiran
    location_types: [Jalan Umum, Perparkiran, Spbu, Stasiun kereta]
    function: SAMAPTA
    executors: Samapta, Polsek
    action: Pertimbangkan penguatan kewaspadaan dan pengamanan parkir
  - id: niaga
    label: Niaga dan perkantoran
    location_types: [Pertokoan, Perkantoran, Cafe, Rumah Makan, Warung, Minimarket, "Mall / Swalayan", Pasar, Hotel, Gedung, Pergudangan]
    function: BINMAS
    executors: Binmas, Polsek
    action: Koordinasikan pengamanan dengan pengelola gedung dan pertokoan
